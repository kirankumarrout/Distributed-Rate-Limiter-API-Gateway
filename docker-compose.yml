version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - rate-limiter-network
  api-gateway-1:
    build: .
    ports:
      - "8001:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - rate-limiter-network
  api-gateway-2:
    build: .
    ports:
      - "8002:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - rate-limiter-network
  api-gateway-3:
    build: .
    ports:
      - "8003:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - rate-limiter-network
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - rate-limiter-network
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - rate-limiter-network
networks:
  rate-limiter-network:
    driver: bridge